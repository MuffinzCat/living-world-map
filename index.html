<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A lightweight, data-first fantasy map editor.">
  <title>Living World Map</title>
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Living World Map</h1>
      <p>A little atlas for a world in progress.</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="panel" aria-labelledby="map-heading">
      <div class="panel-heading">
        <div>
          <h2 id="map-heading">Map</h2>
          <p id="status" role="status" aria-live="polite">Loading sample world…</p>
        </div>
      </div>
      <div class="map-frame">
        <svg id="map" xmlns="http://<scrubbed-url-domain>/2000/svg" role="img" aria-label="Fantasy world map"></svg>
      </div>
    </section>

    <section class="panel data-panel" aria-labelledby="data-heading">
      <div class="panel-heading">
        <div>
          <h2 id="data-heading">World data</h2>
          <p>Versioned JSON is the source of truth.</p>
        </div>
      </div>
      <label class="visually-hidden" for="world-data">World JSON</label>
      <textarea id="world-data" spellcheck="false" readonly></textarea>
    </section>
  </main>

  <noscript>This editor requires JavaScript to run.</noscript>
</body>
</html>
